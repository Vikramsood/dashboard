name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend-springboot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend-springboot/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test, and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=aeroops-dashboard

      - name: Build Docker image
        run: docker build -t aeroops-backend:${{ github.sha }} .

      - name: Trivy full report (non-blocking)
        run: trivy image --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 --format table aeroops-backend:${{ github.sha }}

      - name: Trivy critical gate (blocking)
        run: trivy image --severity CRITICAL --exit-code 1 --format table aeroops-backend:${{ github.sha }}
